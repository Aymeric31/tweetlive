name: send then delete tweet when live 3 hours later
on:
  workflow_dispatch:

jobs:
  send_tweet:
    if: ${{ github.ref == 'refs/heads/discord-live-now' }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@v6
      - name: setup python
        uses: actions/setup-python@v6
        with:
          python-version: '3.10'
      - name: install python packages
        run: |
          python -m pip install --upgrade pip
          pip install -r requirement.txt
      - name: Execute main.py
        env:
          TWITCH_USERNAME: ${{ secrets.TWITCH_USERNAME }}
          TWITCH_CLIENT_ID: ${{ secrets.TWITCH_CLIENT_ID }}
          TWITCH_ACCESS_TOKEN: ${{ secrets.TWITCH_ACCESS_TOKEN }}
          TWITCH_CLIENT_SECRET: ${{ secrets.TWITCH_CLIENT_SECRET }}
          DISCORD_WEBHOOK: ${{ secrets.DISCORD_WEBHOOK }}
        run: |
          python main.py
      - name: Log execution
        run: echo "Execution of the task"
